name: Weekly update

# Fetches results, settles bets and rebuilds the dataset, then commits
# the refreshed data files back to the repo.
#
#   - Tuesday / Friday 08:00 UTC   -> results only, after each round
#   - "Run workflow" button        -> results only, unless "predict" is ticked
#   - push Next_Matchweek.txt      -> also predicts that gameweek and records bets
#
# Scheduled runs never predict: they would only re-chew a stale fixture
# list. Predictions happen when you deliberately push new fixtures.

on:
  workflow_dispatch:
    inputs:
      predict:
        description: "Also predict the next gameweek from Next_Matchweek.txt"
        type: boolean
        default: false
  push:
    paths:
      - "data/raw/Next_Matchweek.txt"
  schedule:
    - cron: "0 8 * * 2,5"

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.predict }}" = "true" ]; then
            python src/run_week.py
          else
            python src/run_week.py --no-predict
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly data update [skip ci]"
            git push
          fi

      # Later: a second job here builds web/ and deploys it to Pages.
