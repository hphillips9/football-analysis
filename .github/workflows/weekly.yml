name: Weekly update

# Fetches results, settles bets, rebuilds the dataset and the site's JSON
# feed, commits it all back, then rebuilds and publishes the website.
#
#   - Tuesday / Friday 08:00 UTC   -> results only, after each round
#   - "Run workflow" button        -> results only, unless "predict" is ticked
#   - push Next_Matchweek.txt      -> also predicts that gameweek and records bets
#
# Scheduled runs never predict: they would only re-chew a stale fixture
# list. Predictions happen when you deliberately push new fixtures.

on:
  workflow_dispatch:
    inputs:
      predict:
        description: "Also predict the next gameweek from Next_Matchweek.txt"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/raw/Next_Matchweek.txt"
  schedule:
    - cron: "0 8 * * 2,5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.predict }}" = "true" ]; then
            python src/run_week.py
          else
            python src/run_week.py --no-predict
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/src/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly data update [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: cd web && npm ci && npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
