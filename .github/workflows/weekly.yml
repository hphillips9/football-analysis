name: Weekly update

# Fetches results, settles bets, pulls the next round's fixtures from
# football-data.org, predicts them and records the bets, rebuilds the
# site's JSON feed, commits it all back, then publishes the website.
#
#   - Daily 08:00 UTC          -> full run
#   - "Run workflow" button    -> full run, unless "predict" is unticked
#
# Running daily is safe: a fixture is only predicted once (anything
# already in Bets.csv is skipped), and nothing is predicted until the
# previous round's results are all on file. Needs the repo secret
# FOOTBALL_DATA_API_KEY.

on:
  workflow_dispatch:
    inputs:
      predict:
        description: "Predict the next round from football-data.org"
        type: boolean
        default: true
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ "${{ inputs.predict }}" = "false" ]; then
            python src/run_week.py --no-predict
          else
            python src/run_week.py
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/src/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly data update [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: cd web && npm ci && npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
